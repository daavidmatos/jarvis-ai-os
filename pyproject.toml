[project]
name = "jarvis-ai-os"
version = "0.2.0"
description = "Provider-agnostic personal AI orchestration system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "redis>=5.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
