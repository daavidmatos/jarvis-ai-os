<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#eaf2ff;background:#060b12}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#193b5a 0,#0a111a 35%,#05080d 70%)}.shell{max-width:980px;margin:auto;padding:34px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{letter-spacing:.32em;font-weight:700}.dot{width:9px;height:9px;border-radius:50%;background:#7ee8ff;box-shadow:0 0 18px #7ee8ff}.panel{background:rgba(9,18,29,.76);border:1px solid rgba(126,232,255,.18);border-radius:22px;backdrop-filter:blur(18px);overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.35)}#messages{height:64vh;overflow:auto;padding:24px}.m{max-width:80%;padding:13px 16px;border-radius:16px;margin:10px 0;line-height:1.48;white-space:pre-wrap}.u{margin-left:auto;background:#173247}.a{background:#0c1824;border:1px solid rgba(126,232,255,.12)}.meta{font-size:11px;opacity:.55;margin-top:6px}.composer{display:flex;gap:10px;border-top:1px solid rgba(255,255,255,.08);padding:14px}textarea{flex:1;resize:none;min-height:54px;max-height:150px;background:#08121d;border:1px solid rgba(126,232,255,.18);border-radius:14px;color:white;padding:15px;outline:none}button{width:110px;border:0;border-radius:14px;background:#d8f7ff;color:#061019;font-weight:700;cursor:pointer}.small{font-size:12px;opacity:.55}
</style>
</head>
<body><div class="shell"><div class="top"><div><div class="brand">JARVIS</div><div class="small">AI Operating System · v0.3 · autonomous routing</div></div><div class="dot"></div></div><div class="panel"><div id="messages"><div class="m a">OpenAI é a inteligência principal. O JARVIS escolhe automaticamente modelos especialistas e ferramentas seguras conforme a tarefa. Ações de alto risco continuam protegidas por aprovação.</div></div><div class="composer"><textarea id="input" placeholder="Fale com o JARVIS..."></textarea><button id="send">ENVIAR</button></div></div></div>
<script>
let session=null;const msgs=document.getElementById('messages'),input=document.getElementById('input');
function add(text,cls,meta=''){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;d.appendChild(m)}msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}
async function send(){const message=input.value.trim();if(!message)return;input.value='';add(message,'u');add('Processando…','a');const pending=msgs.lastChild;try{const r=await fetch('/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,session_id:session})});const d=await r.json();pending.remove();if(!r.ok)throw new Error(d.detail||JSON.stringify(d));session=d.session_id;add(d.message,'a',`${d.provider||'n/a'} · ${d.model||'n/a'} · ${d.workflow_id}`)}catch(e){pending.remove();add('Erro: '+e.message,'a')}}
document.getElementById('send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}})
</script></body></html>
